name: CI

on:
  push:
    branches: [eval]
  pull_request:
    branches: [eval]

# The eval branch is an orphan branch of svd/mcp-client-kit: it carries the eval
# harness, while the engine under test lives on dev/main of the same repo. The
# pyproject points [tool.uv.sources] at a sibling ../mcp-client-kit checkout, so
# every job checks out both refs side by side under the workspace.
env:
  ENGINE_REF: dev

defaults:
  run:
    working-directory: mcp-client-kit-eval

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: mcp-client-kit-eval

      - name: Check out the engine under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ENGINE_REF }}
          path: mcp-client-kit

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mcp-client-kit-eval

      - name: Check out the engine under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ENGINE_REF }}
          path: mcp-client-kit

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format)
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mcp-client-kit-eval

      - name: Check out the engine under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ENGINE_REF }}
          path: mcp-client-kit

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      - name: Type check (mypy)
        run: uv run mypy eval_harness

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mcp-client-kit-eval

      - name: Check out the engine under test
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ENGINE_REF }}
          path: mcp-client-kit

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --dev

      # Guards what lands in git, which verify.py never sees: it judges one run's
      # output, not the committed record of it.
      - name: Check committed eval artifacts
        run: uv run eval-kit check-artifacts
