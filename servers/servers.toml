# servers.example.toml — Reference server configurations for mcp-client-kit-eval
# Copy entries you want to evaluate into servers.toml
# Each [[server]] block configures one MCP server for eval.

# --- everything ---
# Reference server with a wide variety of tool types. No auth.
# Requires npx (Node.js). Install Node.js if not present.
[[server]]
name = "everything"
transport = "stdio"
launch = "npx -y @modelcontextprotocol/server-everything"
auth = "none"
notes = "MCP reference server covering all tool/resource/prompt types."

# --- filesystem ---
# Exposes local filesystem tools scoped to a directory. No auth.
# Requires npx. The path argument (/private/tmp) can be changed.
[[server]]
name = "filesystem"
transport = "stdio"
launch = "npx -y @modelcontextprotocol/server-filesystem /private/tmp"
auth = "none"
notes = "Filesystem access scoped to /private/tmp."

# --- deepwiki ---
# DeepWiki public MCP endpoint. No auth or install required.
# HTTP transport — no local process needed.
[[server]]
name = "deepwiki"
transport = "http"
launch = "https://mcp.deepwiki.com/mcp"
auth = "none"
notes = "DeepWiki public HTTP MCP endpoint. No auth required."

# --- context7 ---
# Upstash Context7 library documentation server. No auth.
# Requires npx (Node.js).
[[server]]
name = "context7"
transport = "stdio"
launch = "npx -y @upstash/context7-mcp"
auth = "none"
env = { CONTEXT7_API_KEY = "${CONTEXT7_API_KEY}" }
notes = "Upstash Context7 — library documentation lookup. Requires CONTEXT7_API_KEY env var for reliable operation; anonymous quota is shared and may exhaust mid-eval. Free key at https://context7.com/dashboard."

# --- codegraph ---
# Local install required. No auth.
[[server]]
name = "codegraph"
transport = "stdio"
launch = "codegraph serve --mcp"
auth = "none"
notes = "Local codegraph code-intelligence server. Binary: codegraph serve --mcp."

# --- sqlite ---
# SQLite database server. No auth. Requires uvx (uv tool runner).
# The --db-path argument points to the database file; adjust as needed.
# Pinned to `mcp<2`: mcp-server-sqlite 2025.4.25 declares mcp[cli]>=1.6.0 (unbounded),
# and an unpinned `uvx` resolves mcp 2.x, whose Server API dropped list_resources() —
# the server crashes on startup (AttributeError) without this pin.
[[server]]
name = "sqlite"
transport = "stdio"
launch = "uvx --with mcp<2 mcp-server-sqlite --db-path /tmp/eval.db"
auth = "none"
notes = "SQLite server backed by /tmp/eval.db. Requires uvx. Pinned to mcp<2 (see comment above) to avoid a startup crash against mcp-server-sqlite 2025.4.25."

# --- time ---
# Simple time/timezone query server. No auth. Requires uvx.
[[server]]
name = "time"
transport = "stdio"
launch = "uvx mcp-server-time"
auth = "none"
notes = "Time and timezone tools. Requires uvx."

# --- memory ---
# In-memory knowledge graph / persistent memory server. No auth.
# Requires npx (Node.js).
[[server]]
name = "memory"
transport = "stdio"
launch = "npx -y @modelcontextprotocol/server-memory"
auth = "none"
notes = "In-memory persistent knowledge graph. Requires npx."

# --- huggingface ---
# HuggingFace public MCP endpoint. No auth or install required.
# HTTP transport — no local process needed.
[[server]]
name = "huggingface"
transport = "http"
launch = "https://huggingface.co/mcp"
auth = "none"
notes = "HuggingFace public HTTP MCP endpoint. No auth required."

# --- github ---
# GitHub Copilot MCP. Requires a GitHub PAT.
# Set GITHUB_PAT env var to a token with repo/issues scope.
[[server]]
name = "github"
transport = "http"
launch = "https://api.githubcopilot.com/mcp/"
auth = "bearer:GITHUB_PAT"
expected_modes = ["A", "B", "C"]
notes = "GitHub Copilot MCP. 35 tools. Requires PAT with repo/issues scope. Use microsoft/vscode as probe repo — octocat/Hello-World has no releases or tags and returns [<empty>] for list_releases, list_tags, list_issue_fields."

# --- git ---
# Local git repository tools. No auth. Requires uvx.
# Operates on repos accessible from the working directory.
[[server]]
name = "git"
transport = "stdio"
launch = "uvx mcp-server-git"
auth = "none"
notes = "Git repository tools. Requires uvx."

# --- sequential-thinking ---
# Sequential/chain-of-thought reasoning server. No auth.
# Requires npx (Node.js).
[[server]]
name = "sequential-thinking"
transport = "stdio"
launch = "npx -y @modelcontextprotocol/server-sequential-thinking"
auth = "none"
notes = "Sequential thinking / chain-of-thought reasoning server. Requires npx."

# --- fetch ---
# HTTP fetch/web content retrieval server. No auth. Requires uvx.
[[server]]
name = "fetch"
transport = "stdio"
launch = "uvx mcp-server-fetch"
auth = "none"
notes = "Web fetch / HTTP content retrieval. Requires uvx."

# ============================================================================
# Tier A candidates (open remote endpoints, no credentials)
# Source: ../mcp-client-kit-marketing/EVAL_SERVER_CANDIDATES.md §3 "Tier A"
# ============================================================================

# --- exa ---
# Exa Search public MCP endpoint. No auth.
[[server]]
name = "exa"
transport = "http"
launch = "https://mcp.exa.ai/mcp"
auth = "none"
notes = "Exa Search public HTTP MCP endpoint. Deeply nested, schema-lied search results — shape-spec material."

# --- aws-knowledge ---
# AWS Knowledge MCP endpoint. No auth.
[[server]]
name = "aws-knowledge"
transport = "http"
launch = "https://knowledge-mcp.global.api.aws"
auth = "none"
notes = "AWS Knowledge public HTTP MCP endpoint. Doc-retrieval envelopes."

# --- semgrep ---
# EVAL_SERVER_CANDIDATES.md lists this as Tier A (open), but verified 2026-08-25:
#   https://mcp.semgrep.ai/sse -> 404 Not Found
#   https://mcp.semgrep.ai/mcp -> 401 Unauthorized,
#     WWW-Authenticate: Bearer, resource_metadata=.../.well-known/oauth-protected-resource
# It is an OAuth server (Tier C), not Tier A. Requires an interactive OAuth flow before eval.
[[server]]
name = "semgrep"
transport = "http"
launch = "https://mcp.semgrep.ai/mcp"
auth = "oauth"
notes = "Semgrep MCP endpoint. Security-scan findings: arrays of heterogeneous records. OAuth-gated (DCR via .well-known/oauth-protected-resource)."

# --- stackoverflow ---
# EVAL_SERVER_CANDIDATES.md lists this as Tier A (open), but verified 2026-08-25:
#   https://mcp.stackoverflow.com      -> 401 Unauthorized, WWW-Authenticate: Bearer
#   https://mcp.stackoverflow.com/mcp  -> 404 Not Found
#   https://mcp.stackoverflow.com/sse  -> 404 Not Found
# It is OAuth-gated (Tier C). Direct streamable-HTTP OAuth via `mcpgen login` fails at
# dynamic client registration (Stack Exchange edge returns a 403 block page), so we use the
# vendor-documented path instead: the `mcp-remote` npx bridge, which runs the browser OAuth
# flow itself and exposes the server over stdio. auth = "none" because the bridge owns the
# token (cached in ~/.mcp-auth), not mcpgen.
[[server]]
name = "stackoverflow"
transport = "stdio"
launch = "npx -y mcp-remote https://mcp.stackoverflow.com"
auth = "none"
notes = "Stack Overflow MCP endpoint via the vendor-documented mcp-remote stdio bridge (OAuth handled by the bridge). Q&A payloads with optional fields — nullability probing."

# --- cloudflare-docs ---
# Cloudflare Docs public MCP endpoint. No auth.
# The /sse endpoint published in EVAL_SERVER_CANDIDATES.md returns 410 Gone as of 2026-08-25;
# the live endpoint is streamable HTTP at /mcp (verified handshake: docs-ai-search 0.4.13, 2 tools).
[[server]]
name = "cloudflare-docs"
transport = "http"
launch = "https://docs.mcp.cloudflare.com/mcp"
auth = "none"
notes = "Cloudflare Docs streamable-HTTP MCP endpoint. Open-auth counterpart to the OAuth Cloudflare servers."

# --- astro-docs ---
# Astro Docs public MCP endpoint (streamable HTTP). No auth.
[[server]]
name = "astro-docs"
transport = "http"
launch = "https://mcp.docs.astro.build/mcp"
auth = "none"
notes = "Astro Docs streamable-HTTP MCP endpoint. Transport-variant coverage (/mcp, not SSE)."

